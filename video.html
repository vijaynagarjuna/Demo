<!DOCTYPE html>
<html>

<head>

    <title>A Special Video  </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<div class="video-page">

    <h1>🎬 A Little Memory,please watch patiently 😅</h1>

    <video
        id="birthdayVideo"
        controls
        autoplay
    >

        <source
            src="{{ url_for('static', filename='videos/birthday.mp4') }}"
            type="video/mp4"
        >

        Your browser does not support video.

    </video>

    <br>

    <a
        id="nextButton"
        href="{{ url_for('letter') }}"
        style="display:none;"
    >

        <button>
            NEXT ➜
        </button>

    </a>

</div>


<script>

const video = document.getElementById("birthdayVideo");

const nextButton = document.getElementById("nextButton");

video.addEventListener("ended", function() {

    nextButton.style.display = "inline-block";

});

</script>

</body>

</html>
