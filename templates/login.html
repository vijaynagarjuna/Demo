<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign In - Birthday Surprise</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <div class="login-page">

        <div class="container">

            <h1>🎂 Welcome</h1>

            <h2>Sign In</h2>

            {% if error %}
                <p class="error">
                    {{ error }}
                </p>
            {% endif %}

            <form method="POST">

                <input
                    type="email"
                    name="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Sign In 💕
                </button>

            </form>

            <p>
                Don't have an account?
                <a href="{{ url_for('signup') }}">
                    Sign Up
                </a>
            </p>

        </div>

    </div>

</body>

</html>
